<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
  }

  .app {
    display: flex;
    min-height: 100vh;
  }

  .sidebar {
    width: 260px;
    background: #ffffff;
    border-right: 1px solid #e5e7eb;
    padding: 24px;
  }

  .brand {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 32px;
  }

  .brand-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: #111827;
    color: #ffffff;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 20px;
  }

  .brand h1 {
    font-size: 18px;
    margin: 0;
  }

  .brand p {
    font-size: 12px;
    color: #6b7280;
    margin: 2px 0 0;
  }

  nav {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  nav a {
    padding: 12px 14px;
    border-radius: 12px;
    color: #4b5563;
    text-decoration: none;
    cursor: pointer;
  }

  nav a.active,
  nav a:hover {
    background: #eef2ff;
    color: #3730a3;
    font-weight: 600;
  }

  .main {
    flex: 1;
    padding: 32px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }

  .topbar h2 {
    font-size: 30px;
    margin: 0;
  }

  .topbar p {
    margin: 6px 0 0;
    color: #6b7280;
  }

  .user-badge {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    padding: 10px 16px;
    border-radius: 999px;
    font-weight: 600;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(5, minmax(160px, 1fr));
    gap: 18px;
  }

  .card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
  }

  .card p {
    margin: 0;
    color: #6b7280;
    font-size: 14px;
  }

  .card h3 {
    margin: 12px 0 0;
    font-size: 34px;
  }

  @media (max-width: 1000px) {
    .cards {
      grid-template-columns: repeat(2, 1fr);
    }

    .sidebar {
      width: 220px;
    }
  }

  @media (max-width: 700px) {
    .app {
      flex-direction: column;
    }

    .sidebar {
      width: 100%;
    }

    .cards {
      grid-template-columns: 1fr;
    }
  }
</style>
