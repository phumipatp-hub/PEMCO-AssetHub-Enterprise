<script>
const PAGE_INFO = {
  dashboard: ['Dashboard', 'ภาพรวมระบบบริหารจัดการ IT ขององค์กร'],
  assets: ['Assets', 'จัดการข้อมูลทรัพย์สิน IT ทั้งหมด'],
  helpdesk: ['Helpdesk', 'จัดการงานแจ้งซ่อมและคำร้องขอ IT'],
  licenses: ['Licenses', 'จัดการ License และวันหมดอายุ'],
  documents: ['Documents', 'จัดเก็บเอกสาร สัญญา และไฟล์อ้างอิง'],
  settings: ['Settings', 'ตั้งค่าระบบและข้อมูลพื้นฐาน']
};

function setActiveMenu(page) {
  document.querySelectorAll('.nav-link').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.page === page);
  });
}

function setHeader(page) {
  document.getElementById('pageTitle').textContent = PAGE_INFO[page][0];
  document.getElementById('pageSubtitle').textContent = PAGE_INFO[page][1];
}

function showPage(page) {
  setActiveMenu(page);
  setHeader(page);

  if (page === 'dashboard') return renderDashboard();
  if (page === 'assets') return renderAssets();

  return renderComingSoon(page);
}

function renderDashboard() {
  document.getElementById('pageContent').innerHTML = `
    <section class="cards">
      <div class="card"><p>Total Assets</p><h3>245</h3></div>
      <div class="card"><p>Available</p><h3>32</h3></div>
      <div class="card"><p>Repair</p><h3>5</h3></div>
      <div class="card"><p>Open Tickets</p><h3>12</h3></div>
      <div class="card"><p>Licenses Expiring</p><h3>3</h3></div>
    </section>
  `;
}

function renderAssets() {
  document.getElementById('pageContent').innerHTML = `
    <section class="panel">
      <div class="panel-header">
        <h3>Asset List</h3>
        <button class="primary-button">+ Add Asset</button>
      </div>

      <div class="toolbar">
        <input id="assetSearch" type="text" placeholder="Search asset code, name, serial number...">
        <select id="assetStatusFilter">
          <option value="">All Status</option>
          <option value="IN_USE">In Use</option>
          <option value="AVAILABLE">Available</option>
          <option value="REPAIR">Repair</option>
          <option value="DISPOSED">Disposed</option>
        </select>
      </div>

      <div id="assetTableContainer">
        <p>Loading assets...</p>
      </div>
    </section>
  `;

  google.script.run
    .withSuccessHandler(function(assets) {
      window.assetData = assets || [];
      renderAssetTable(window.assetData);

      document.getElementById('assetSearch').addEventListener('input', filterAssets);
      document.getElementById('assetStatusFilter').addEventListener('change', filterAssets);
    })
    .withFailureHandler(function(error) {
      document.getElementById('assetTableContainer').innerHTML = `
        <div class="empty-state">
          <h3>Load Assets Failed</h3>
          <p>${error.message}</p>
        </div>
      `;
    })
    .getAssets();
}

function filterAssets() {
  const keyword = document.getElementById('assetSearch').value.toLowerCase();
  const status = document.getElementById('assetStatusFilter').value;

  const filtered = window.assetData.filter(function(asset) {
    const text = [
      asset.asset_code,
      asset.asset_name,
      asset.model,
      asset.serial_number,
      asset.owner_user_id,
      asset.location_id,
      asset.status_id
    ].join(' ').toLowerCase();

    const matchKeyword = text.includes(keyword);
    const matchStatus = !status || asset.status_id === status;

    return matchKeyword && matchStatus;
  });

  renderAssetTable(filtered);
}

function renderAssetTable(assets) {
  const container = document.getElementById('assetTableContainer');

  if (!assets || assets.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <h3>No Assets Found</h3>
        <p>ยังไม่มีข้อมูลทรัพย์สิน หรือไม่พบข้อมูลจากการค้นหา</p>
      </div>
    `;
    return;
  }

  const rows = assets.map(function(asset) {
    return `
      <tr>
        <td>${asset.asset_code}</td>
        <td>${asset.asset_name}</td>
        <td>${asset.category_id}</td>
        <td>${asset.owner_user_id}</td>
        <td><span class="status blue">${asset.status_id}</span></td>
        <td>${asset.location_id}</td>
      </tr>
    `;
  }).join('');

  container.innerHTML = `
    <table class="data-table">
      <thead>
        <tr>
          <th>Asset Code</th>
          <th>Name</th>
          <th>Category</th>
          <th>Owner</th>
          <th>Status</th>
          <th>Location</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>
  `;
}

function renderComingSoon(page) {
  document.getElementById('pageContent').innerHTML = `
    <section class="empty-state">
      <h3>${PAGE_INFO[page][0]}</h3>
      <p>หน้านี้จะถูกพัฒนาต่อใน Sprint ถัดไป</p>
    </section>
  `;
}

document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.nav-link').forEach(function(btn) {
    btn.addEventListener('click', function() {
      showPage(btn.dataset.page);
    });
  });

  showPage('dashboard');
});
</script>
