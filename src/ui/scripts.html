<script>
const PAGE_INFO = {
  dashboard: ['Dashboard', 'ภาพรวมระบบบริหารจัดการ IT ขององค์กร'],
  assets: ['Assets', 'จัดการข้อมูลทรัพย์สิน IT ทั้งหมด'],
  helpdesk: ['Helpdesk', 'จัดการงานแจ้งซ่อมและคำร้องขอ IT'],
  licenses: ['Licenses', 'จัดการ License และวันหมดอายุ'],
  documents: ['Documents', 'จัดเก็บเอกสาร สัญญา และไฟล์อ้างอิง'],
  settings: ['Settings', 'ตั้งค่าระบบและข้อมูลพื้นฐาน']
};

function setActiveMenu(page) {
  document.querySelectorAll('.nav-link').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.page === page);
  });
}

function setHeader(page) {
  document.getElementById('pageTitle').textContent = PAGE_INFO[page][0];
  document.getElementById('pageSubtitle').textContent = PAGE_INFO[page][1];
}

function showPage(page) {
  setActiveMenu(page);
  setHeader(page);

  if (page === 'dashboard') return renderDashboard();
  if (page === 'assets') return renderAssets();

  return renderComingSoon(page);
}

function renderDashboard() {
  document.getElementById('pageContent').innerHTML = `
    <section class="cards">
      <div class="card"><p>Total Assets</p><h3>245</h3></div>
      <div class="card"><p>Available</p><h3>32</h3></div>
      <div class="card"><p>Repair</p><h3>5</h3></div>
      <div class="card"><p>Open Tickets</p><h3>12</h3></div>
      <div class="card"><p>Licenses Expiring</p><h3>3</h3></div>
    </section>
  `;
}

function renderAssets() {
  document.getElementById('pageContent').innerHTML = `
    <section class="panel">
      <div class="panel-header">
        <h3>Asset List</h3>
        <button class="primary-button">+ Add Asset</button>
      </div>

      <div class="toolbar">
        <input type="text" placeholder="Search asset code, name, serial number...">
        <select>
          <option>All Status</option>
          <option>Available</option>
          <option>In Use</option>
          <option>Repair</option>
        </select>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Asset Code</th>
            <th>Name</th>
            <th>Category</th>
            <th>Owner</th>
            <th>Status</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>IT-NB-0001</td>
            <td>Dell Latitude 5420</td>
            <td>Notebook</td>
            <td>Somchai</td>
            <td><span class="status green">In Use</span></td>
            <td>HQ / IT Room</td>
          </tr>
          <tr>
            <td>IT-PR-0001</td>
            <td>HP LaserJet Pro</td>
            <td>Printer</td>
            <td>-</td>
            <td><span class="status blue">Available</span></td>
            <td>HQ / Floor 2</td>
          </tr>
          <tr>
            <td>IT-PC-0008</td>
            <td>Lenovo ThinkCentre</td>
            <td>Computer</td>
            <td>Wanwisa</td>
            <td><span class="status orange">Repair</span></td>
            <td>Service Desk</td>
          </tr>
        </tbody>
      </table>
    </section>
  `;
}

function renderComingSoon(page) {
  document.getElementById('pageContent').innerHTML = `
    <section class="empty-state">
      <h3>${PAGE_INFO[page][0]}</h3>
      <p>หน้านี้จะถูกพัฒนาต่อใน Sprint ถัดไป</p>
    </section>
  `;
}

document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.nav-link').forEach(function(btn) {
    btn.addEventListener('click', function() {
      showPage(btn.dataset.page);
    });
  });

  showPage('dashboard');
});
</script>
