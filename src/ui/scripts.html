<script>
  function loadDashboard() {
    google.script.run
      .withSuccessHandler(function(data) {
        document.getElementById('totalAssets').textContent = data.totalAssets;
        document.getElementById('availableAssets').textContent = data.availableAssets;
        document.getElementById('repairAssets').textContent = data.repairAssets;
        document.getElementById('openTickets').textContent = data.openTickets;
        document.getElementById('expiringLicenses').textContent = data.expiringLicenses;
      })
      .getDashboardSummary();
  }

  document.addEventListener('DOMContentLoaded', loadDashboard);
</script>
